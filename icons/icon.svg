<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="#4285f4"/>

  <!-- Left lens -->
  <circle cx="42" cy="58" r="22" fill="#1a73e8" stroke="white" stroke-width="4"/>
  <circle cx="42" cy="58" r="14" fill="#2b7de9"/>
  <circle cx="42" cy="58" r="8" fill="#5c9cf5"/>
  <ellipse cx="38" cy="54" rx="3" ry="2" fill="white" opacity="0.6"/>

  <!-- Right lens -->
  <circle cx="86" cy="58" r="22" fill="#1a73e8" stroke="white" stroke-width="4"/>
  <circle cx="86" cy="58" r="14" fill="#2b7de9"/>
  <circle cx="86" cy="58" r="8" fill="#5c9cf5"/>
  <ellipse cx="82" cy="54" rx="3" ry="2" fill="white" opacity="0.6"/>

  <!-- Bridge connecting lenses -->
  <rect x="54" y="52" width="20" height="12" rx="4" fill="white"/>

  <!-- Focus wheel on top -->
  <rect x="58" y="44" width="12" height="10" rx="2" fill="#e8e8e8"/>
  <line x1="64" y1="46" x2="64" y2="52" stroke="#ccc" stroke-width="1"/>

  <!-- Left eyepiece -->
  <rect x="30" y="78" width="24" height="14" rx="4" fill="white"/>

  <!-- Right eyepiece -->
  <rect x="74" y="78" width="24" height="14" rx="4" fill="white"/>
</svg>
