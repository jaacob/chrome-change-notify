<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      background: #f8f9fa;
    }

    h1 {
      font-size: 16px;
      color: #333;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 .icon {
      font-size: 20px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 10px;
    }

    .btn-primary {
      background: #4285f4;
      color: white;
    }

    .btn-primary:hover {
      background: #3367d6;
    }

    .btn-secondary {
      background: white;
      color: #333;
      border: 1px solid #ddd;
    }

    .btn-secondary:hover {
      background: #f5f5f5;
    }

    .status {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-top: 12px;
      padding: 8px;
      background: white;
      border-radius: 4px;
    }

    .status strong {
      color: #4285f4;
    }

    .selecting-message {
      display: none;
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .selecting-message .spinner {
      margin-bottom: 10px;
      font-size: 24px;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    body.selecting .main-content {
      display: none;
    }

    body.selecting .selecting-message {
      display: block;
    }

    .monitors-section {
      margin-bottom: 16px;
    }

    .monitors-title {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .monitor-item {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .monitor-item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }

    .monitor-selector {
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 11px;
      color: #5f6368;
      word-break: break-all;
      flex: 1;
    }

    .btn-delete-small {
      background: #fce8e6;
      color: #d93025;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .btn-delete-small:hover {
      background: #f8d7da;
    }

    .monitor-preview {
      font-size: 11px;
      color: #888;
      padding: 6px 8px;
      background: #f8f9fa;
      border-radius: 3px;
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="main-content">
    <h1><span class="icon">👁</span> DOM Monitor</h1>

    <div id="currentPageMonitors" class="monitors-section" style="display: none;">
      <div class="monitors-title">Monitors on this page</div>
      <div id="monitorsList"></div>
    </div>

    <button class="btn btn-primary" id="selectBtn">
      Select Element to Monitor
    </button>

    <button class="btn btn-secondary" id="manageBtn">
      Manage Monitors
    </button>

    <div class="status" id="status">
      Loading...
    </div>
  </div>

  <div class="selecting-message">
    <div class="spinner">🎯</div>
    <p>Click on any element on the page to monitor it</p>
    <p style="font-size: 11px; margin-top: 8px; color: #999;">Press ESC to cancel</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
